name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. Python 3.11
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 4. Install Linux dependencies
      # ============================================================
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            unzip \
            zip \
            build-essential \
            cmake \
            ninja-build \
            pkg-config

          echo "Linux dependencies installed."


      # ============================================================
      # 5. Check project
      # ============================================================
      - name: Check project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DAIRY FARM PROJECT"
          echo "======================================"

          echo ""
          echo "Project files:"
          find . -maxdepth 2 -type f | sort

          echo ""

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py was not found."
            echo ""
            echo "Your project must contain main.py"
            exit 1
          fi

          echo "main.py found."


      # ============================================================
      # 6. Install PySide6
      # ============================================================
      - name: Install PySide6
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "PySide6==6.11.2"

          echo ""
          echo "PySide6 installed."

          python -c "import PySide6; print('PySide6 version:', PySide6.__version__)"


      # ============================================================
      # 7. Install Android deployment requirements
      # ============================================================
      - name: Install Android deployment requirements
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID DEPLOYMENT REQUIREMENTS"
          echo "======================================"

          REQUIREMENTS_FILE="$(
            python -c '
          import PySide6
          import os

          print(
              os.path.join(
                  os.path.dirname(PySide6.__file__),
                  "scripts",
                  "requirements-android.txt"
              )
          )
          '
          )"

          echo ""
          echo "Requirements file:"
          echo "$REQUIREMENTS_FILE"

          if [ ! -f "$REQUIREMENTS_FILE" ]; then
            echo "ERROR: requirements-android.txt not found."
            exit 1
          fi

          echo ""
          echo "Installing official PySide6 Android requirements..."

          python -m pip install \
            --upgrade \
            -r "$REQUIREMENTS_FILE"

          echo ""
          echo "Android requirements installed."


      # ============================================================
      # 8. Verify pkginfo
      # ============================================================
      - name: Verify deployment packages
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING PACKAGES"
          echo "======================================"

          python -c "import pkginfo; print('pkginfo OK')"
          python -c "import packaging; print('packaging OK')"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "pip:"
          python -m pip --version


      # ============================================================
      # 9. Download Android PySide6 wheel
      # ============================================================
      - name: Download PySide6 Android wheel
        shell: bash
        run: |
          set -e

          echo "Downloading PySide6 Android wheel..."

          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo ""
          echo "PySide6 wheel downloaded."

          ls -lh pyside6-*.whl


      # ============================================================
      # 10. Download Shiboken6 Android wheel
      # ============================================================
      - name: Download Shiboken6 Android wheel
        shell: bash
        run: |
          set -e

          echo "Downloading Shiboken6 Android wheel..."

          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo ""
          echo "Shiboken6 wheel downloaded."

          ls -lh shiboken6-*.whl


      # ============================================================
      # 11. Verify wheels
      # ============================================================
      - name: Verify Android wheels
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL="$GITHUB_WORKSPACE/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_WHEEL="$GITHUB_WORKSPACE/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo "Checking PySide6 wheel..."

          test -f "$PYSIDE_WHEEL"

          echo "Checking Shiboken6 wheel..."

          test -f "$SHIBOKEN_WHEEL"

          echo ""
          echo "Both Android wheels are available."

          ls -lh "$PYSIDE_WHEEL"
          ls -lh "$SHIBOKEN_WHEEL"


      # ============================================================
      # 12. Check Android deploy command
      # ============================================================
      - name: Check Android deploy
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PYSIDE6 ANDROID DEPLOY"
          echo "======================================"

          command -v pyside6-android-deploy

          echo ""
          echo "Deploy tool:"
          pyside6-android-deploy --help


      # ============================================================
      # 13. Clean old build
      # ============================================================
      - name: Clean old build
        shell: bash
        run: |
          set -e

          rm -rf artifacts
          rm -rf .buildozer
          rm -rf deployment

          mkdir -p artifacts

          echo "Old build files removed."


      # ============================================================
      # 14. Build APK
      # ============================================================
      - name: Build Dairy Farm APK
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL="$GITHUB_WORKSPACE/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          SHIBOKEN_WHEEL="$GITHUB_WORKSPACE/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo "======================================"
          echo "BUILDING DAIRY FARM APK"
          echo "======================================"

          echo ""
          echo "Main Python file:"
          ls -lh main.py

          echo ""
          echo "PySide6 wheel:"
          ls -lh "$PYSIDE_WHEEL"

          echo ""
          echo "Shiboken6 wheel:"
          ls -lh "$SHIBOKEN_WHEEL"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "======================================"
          echo "STARTING ANDROID DEPLOYMENT"
          echo "======================================"

          pyside6-android-deploy \
            --name "Dairy Farm" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --force

          echo ""
          echo "======================================"
          echo "ANDROID DEPLOYMENT FINISHED"
          echo "======================================"


      # ============================================================
      # 15. Search for APK
      # ============================================================
      - name: Search for APK
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          echo ""
          echo "APK files found:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo ""
          echo "AAB files found:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print 2>/dev/null || true


      # ============================================================
      # 16. Prepare final APK
      # ============================================================
      - name: Prepare final APK
        if: success()
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            ! -path "*/artifacts/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then

            echo ""
            echo "======================================"
            echo "ERROR: APK WAS NOT GENERATED"
            echo "======================================"

            echo ""
            echo "All APK/AAB files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"

          echo ""
          echo "Final APK created:"

          ls -lh \
            "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"


      # ============================================================
      # 17. Upload APK
      # ============================================================
      - name: Upload Dairy Farm APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: artifacts/Dairy-Farm.apk
          if-no-files-found: error


      # ============================================================
      # 18. Final result
      # ============================================================
      - name: Final result
        if: always()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "DAIRY FARM APK BUILD RESULT"
          echo "======================================"

          if [ -f "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk" ]; then

            echo ""
            echo "BUILD STATUS: SUCCESS"
            echo ""
            echo "APK:"
            ls -lh "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"

            echo ""
            echo "Your install-ready APK is:"
            echo "Dairy-Farm.apk"

          else

            echo ""
            echo "BUILD STATUS: FAILED"
            echo ""
            echo "APK was not created."

          fi
