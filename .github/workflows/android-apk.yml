name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Get project
      - name: Get project
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 3. Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 4. Check project files
      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la

          test -f dairy_app.py
          test -f main.py
          test -f dairy_farm.db

          echo "All required files found."


      # 5. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # 6. Fix Android SDK tools
      - name: Fix Android SDK tools
        shell: bash
        run: |
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Searching for modern sdkmanager..."

          MODERN_SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$MODERN_SDKMANAGER" ]; then
            echo "ERROR: Modern sdkmanager was not found."
            exit 1
          fi

          echo "Modern sdkmanager found:"
          echo "$MODERN_SDKMANAGER"

          MODERN_SDK_BIN=$(dirname "$MODERN_SDKMANAGER")

          echo "Modern SDK bin:"
          echo "$MODERN_SDK_BIN"

          echo "$MODERN_SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo ""
          echo "Creating compatibility sdkmanager..."

          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          cat > "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" <<EOF
          #!/bin/bash
          exec "$MODERN_SDKMANAGER" "\$@"
          EOF

          chmod +x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo ""
          echo "Testing sdkmanager..."

          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version


      # 7. Install Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "Installing Android SDK packages..."

          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108"

          echo ""
          echo "Accepting Android licenses..."

          yes | "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --licenses || true

          echo ""
          echo "Android SDK setup complete."


      # 8. Install Python packages
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install PySide6==6.11.2

          pip install \
            pkginfo \
            packaging \
            jinja2 \
            tqdm \
            buildozer \
            setuptools


      # 9. Download Android PySide6 wheel
      - name: Download Android PySide6 wheel
        run: |
          wget -q \
            https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl


      # 10. Download Android Shiboken6 wheel
      - name: Download Android Shiboken6 wheel
        run: |
          wget -q \
            https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl


      # 11. Check wheels
      - name: Find Android wheels
        run: |
          echo "Downloaded Android wheels:"
          ls -lh *.whl

          echo ""
          echo "PySide6 wheel:"
          find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -name "pyside6-*-android_aarch64.whl"

          echo ""
          echo "Shiboken6 wheel:"
          find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -name "shiboken6-*-android_aarch64.whl"


      # 12. Check deployment tool
      - name: Check deployment tool
        run: |
          echo "Checking PySide6 Android deploy..."

          pyside6-android-deploy --help


      # 13. Build APK
      - name: Build Android APK
        shell: bash
        run: |

          echo "Preparing Android build..."

          PYSIDE_WHEEL=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -name "pyside6-*-android_aarch64.whl" \
            | head -n 1)

          SHIBOKEN_WHEEL=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -name "shiboken6-*-android_aarch64.whl" \
            | head -n 1)


          echo ""
          echo "PySide6 wheel:"
          echo "$PYSIDE_WHEEL"

          echo ""
          echo "Shiboken6 wheel:"
          echo "$SHIBOKEN_WHEEL"


          # Make sure both wheels exist
          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"


          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Android NDK:"
          echo "$ANDROID_NDK_ROOT"


          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version


          echo ""
          echo "Starting PySide6 Android build..."

          pyside6-android-deploy \
            --name "Dairy Farm" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --ndk-path "$ANDROID_NDK_ROOT" \
            --sdk-path "$ANDROID_SDK_ROOT" \
            --force


      # 14. Find APK
      - name: Find APK
        if: always()
        run: |
          echo "Searching for APK/AAB..."

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print


      # 15. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
