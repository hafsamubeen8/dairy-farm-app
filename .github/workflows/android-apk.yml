name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Checkout
      - name: Checkout project
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # 3. Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 4. Linux packages
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libffi-dev \
            libssl-dev

          echo "Linux dependencies OK"


      # 5. Check project
      - name: Check project
        shell: bash
        run: |
          set -euxo pipefail

          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          find . -maxdepth 2 -type f | sort

          echo ""

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py not found"
            exit 1
          fi

          echo "main.py FOUND"

          if [ -f "dairy_farm.db" ]; then
            echo "dairy_farm.db FOUND"
          fi

          if [ -f "dairy_app.py" ]; then
            echo "dairy_app.py FOUND"
          fi


      # 6. Install PySide6
      - name: Install PySide6
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "PySide6==6.11.2"

          python -c "import PySide6; print('PySide6:', PySide6.__version__)"


      # 7. Install ALL Android requirements
      - name: Install Android deployment requirements
        shell: bash
        run: |
          set -euxo pipefail

          REQUIREMENTS_FILE=$(python -c '
          import PySide6
          import os
          print(os.path.join(
              os.path.dirname(PySide6.__file__),
              "scripts",
              "requirements-android.txt"
          ))
          ')

          echo "Requirements:"
          echo "$REQUIREMENTS_FILE"

          test -f "$REQUIREMENTS_FILE"

          python -m pip install --upgrade \
            -r "$REQUIREMENTS_FILE"

          # Explicitly install the package that previously caused the error
          python -m pip install --upgrade pkginfo

          echo ""
          echo "Android requirements installed"


      # 8. Verify packages
      - name: Verify Python deployment packages
        shell: bash
        run: |
          set -euxo pipefail

          python -c "import pkginfo; print('pkginfo OK')"
          python -c "import packaging; print('packaging OK')"
          python -c "import jinja2; print('jinja2 OK')"
          python -c "import PySide6; print('PySide6 OK')"

          echo ""
          python -m pip show pkginfo
          python -m pip show PySide6


      # 9. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # 10. Download PySide6 Android wheel
      - name: Download PySide6 Android wheel
        shell: bash
        run: |
          set -euxo pipefail

          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          test -f pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          ls -lh pyside6-*.whl


      # 11. Download Shiboken6 Android wheel
      - name: Download Shiboken6 Android wheel
        shell: bash
        run: |
          set -euxo pipefail

          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          test -f shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          ls -lh shiboken6-*.whl


      # 12. Verify deploy command
      - name: Verify PySide Android deploy
        shell: bash
        run: |
          set -euxo pipefail

          echo "=============================="
          echo "PYSIDE6 ANDROID DEPLOY"
          echo "=============================="

          which pyside6-android-deploy

          python -m pip show pkginfo

          pyside6-android-deploy --help


      # 13. Clean
      - name: Clean previous build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf deployment
          rm -rf .buildozer
          rm -rf artifacts

          mkdir -p artifacts

          echo "Clean build directory ready"


      # 14. BUILD APK
      - name: Build Dairy Farm APK
        shell: bash
        run: |
          set -euxo pipefail

          PYSIDE_WHEEL="$GITHUB_WORKSPACE/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          SHIBOKEN_WHEEL="$GITHUB_WORKSPACE/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo ""
          echo "=========================================="
          echo "STARTING ANDROID DEPLOYMENT"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Main:"
          ls -lh main.py

          echo ""
          echo "PySide wheel:"
          ls -lh "$PYSIDE_WHEEL"

          echo ""
          echo "Shiboken wheel:"
          ls -lh "$SHIBOKEN_WHEEL"

          echo ""
          echo "Running pyside6-android-deploy..."

          pyside6-android-deploy \
            --name "Dairy Farm" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --force

          echo ""
          echo "=========================================="
          echo "ANDROID DEPLOYMENT FINISHED"
          echo "=========================================="


      # 15. Find APK
      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          echo ""
          echo "APK files:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo ""
          echo "AAB files:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print 2>/dev/null || true


      # 16. Prepare APK
      - name: Prepare final APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          APK_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            ! -path "*/artifacts/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"


      # 17. Upload APK
      - name: Upload Dairy Farm APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: artifacts/Dairy-Farm.apk
          if-no-files-found: error


      # 18. Final status
      - name: Final result
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "DAIRY FARM BUILD RESULT"
          echo "=========================================="

          if [ -f "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk" ]; then
            echo ""
            echo "SUCCESS"
            echo "Dairy-Farm.apk was created."
            ls -lh "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"
          else
            echo ""
            echo "FAILED"
            echo "Dairy-Farm.apk was NOT created."
          fi
