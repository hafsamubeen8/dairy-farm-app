name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          ls -la
          test -f dairy_app.py
          test -f main.py
          test -f dairy_farm.db

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;28.0.13004108"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.2
          pip install pkginfo packaging jinja2 tqdm buildozer setuptools
          pip install -r /opt/hostedtoolcache/Python/3.11.*/x64/lib/python3.11/site-packages/PySide6/scripts/requirements-android.txt

      - name: Download official Android wheels
        run: |
          wget -O pyside6_android.whl \
            https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          wget -O shiboken6_android.whl \
            https://download.qt.io/official_releases/QtForPython/pyside6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

      - name: Check deployment tool
        run: |
          pyside6-android-deploy --help

      - name: Build Android APK
        run: |
          pyside6-android-deploy \
            --name "Dairy Farm" \
            --wheel-pyside "$GITHUB_WORKSPACE/pyside6_android.whl" \
            --wheel-shiboken "$GITHUB_WORKSPACE/shiboken6_android.whl" \
            --ndk-path "$ANDROID_NDK_ROOT" \
            --sdk-path "$ANDROID_SDK_ROOT" \
            --force

      - name: Find APK
        run: |
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: |
            **/*.apk
            **/*.aab
