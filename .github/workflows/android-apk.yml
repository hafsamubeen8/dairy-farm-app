name: Build Dairy Farm APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout project
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Python 3.11
      # ==========================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 4. Linux dependencies
      # ==========================================
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            unzip \
            zip \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libffi-dev \
            libssl-dev

          echo "Linux dependencies installed."


      # ==========================================
      # 5. Check project files
      # ==========================================
      - name: Check project
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          find . -maxdepth 3 -type f | sort

          echo ""

          test -f main.py
          test -f dairy_app.py
          test -f dairy_farm.db
          test -f pyproject.toml

          echo "main.py FOUND"
          echo "dairy_app.py FOUND"
          echo "dairy_farm.db FOUND"
          echo "pyproject.toml FOUND"


      # ==========================================
      # 6. Install PySide6
      # ==========================================
      - name: Install PySide6
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "PySide6==6.11.2"

          python -c "import PySide6; print('PySide6:', PySide6.__version__)"


      # ==========================================
      # 7. Install Android deployment requirements
      # ==========================================
      - name: Install Android deployment requirements
        shell: bash
        run: |
          set -euxo pipefail

          REQUIREMENTS_FILE=$(python -c '
          import PySide6
          import os

          print(
              os.path.join(
                  os.path.dirname(PySide6.__file__),
                  "scripts",
                  "requirements-android.txt"
              )
          )
          ')

          echo "Requirements file:"
          echo "$REQUIREMENTS_FILE"

          test -f "$REQUIREMENTS_FILE"

          python -m pip install \
            --upgrade \
            -r "$REQUIREMENTS_FILE"

          python -m pip install \
            --upgrade \
            pkginfo

          echo "Android deployment requirements installed."


      # ==========================================
      # 8. Android SDK
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================
      # 9. Accept Android licenses
      # ==========================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses || true

          echo "Android SDK licenses accepted."


      # ==========================================
      # 10. Install Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK packages installed."

          echo ""
          echo "Installed Build Tools:"
          ls -lah "$ANDROID_HOME/build-tools"

          echo ""
          echo "AIDL files:"
          find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "aidl" \
            -print


      # ==========================================
      # 11. Configure Buildozer Android SDK
      # ==========================================
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.buildozer"

          cat > "$HOME/.buildozer/default.spec" <<EOF
          [app]

          # Application title
          title = Dairy Farm

          # Package name
          package.name = dairyfarm

          # Package domain
          package.domain = org.dairyfarm

          # Source directory
          source.dir = .

          # Source files
          source.include_exts = py,db,toml

          # Main Python file
          entrypoint = main.py

          # Android orientation
          orientation = portrait

          # Android architecture
          android.archs = arm64-v8a

          # Android API
          android.api = 35

          # Minimum Android API
          android.minapi = 28

          # Android SDK location
          android.sdk_path = $ANDROID_HOME

          # Android NDK
          android.ndk = 27c

          # Python requirements
          requirements = python3,pyjnius

          # Fullscreen
          fullscreen = 0
          EOF

          echo "Buildozer configuration created."


      # ==========================================
      # 12. Configure environment for Buildozer
      # ==========================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROIDSDK=$ANDROIDSDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.buildozer/android/platform"

          ln -sfn \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "Buildozer Android SDK:"
          ls -ld \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "Build Tools:"
          ls -lah \
            "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          ls -lh \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"


      # ==========================================
      # 13. Download PySide6 Android wheel
      # ==========================================
      - name: Download PySide6 Android wheel
        shell: bash
        run: |
          set -euxo pipefail

          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          test -f \
            pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          ls -lh pyside6-*.whl


      # ==========================================
      # 14. Download Shiboken6 Android wheel
      # ==========================================
      - name: Download Shiboken6 Android wheel
        shell: bash
        run: |
          set -euxo pipefail

          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          test -f \
            shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          ls -lh shiboken6-*.whl


      # ==========================================
      # 15. Verify deployment tool
      # ==========================================
      - name: Verify PySide Android deployment
        shell: bash
        run: |
          set -euxo pipefail

          echo "pyside6-android-deploy:"
          which pyside6-android-deploy

          echo ""
          echo "pkginfo:"
          python -c "import pkginfo; print('pkginfo OK')"

          echo ""
          echo "PySide6:"
          python -c "import PySide6; print(PySide6.__version__)"

          echo ""
          echo "Deployment help:"
          pyside6-android-deploy --help


      # ==========================================
      # 16. Clean previous build
      # ==========================================
      - name: Clean previous build
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf deployment
          rm -rf .buildozer
          rm -rf artifacts

          mkdir -p artifacts

          echo "Clean build directory ready."


      # ==========================================
      # 17. Re-create Buildozer SDK link
      # ==========================================
      - name: Restore Buildozer Android SDK link
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.buildozer/android/platform"

          ln -sfn \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK link:"
          ls -ld \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo ""
          echo "Build Tools:"
          ls -lah \
            "$ANDROID_HOME/build-tools/35.0.0"

          echo ""
          echo "AIDL:"
          test -x \
            "$ANDROID_HOME/build-tools/35.0.0/aidl"

          echo "AIDL is available."


      # ==========================================
      # 18. Build APK
      # ==========================================
      - name: Build Dairy Farm APK
        shell: bash
        run: |
          set -euxo pipefail

          PYSIDE_WHEEL="$GITHUB_WORKSPACE/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          SHIBOKEN_WHEEL="$GITHUB_WORKSPACE/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo "=========================================="
          echo "STARTING DAIRY FARM ANDROID BUILD"
          echo "=========================================="

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Project:"
          ls -lah

          echo ""
          echo "PySide wheel:"
          ls -lh "$PYSIDE_WHEEL"

          echo ""
          echo "Shiboken wheel:"
          ls -lh "$SHIBOKEN_WHEEL"

          echo ""
          echo "Starting deployment..."

          pyside6-android-deploy \
            --name "Dairy Farm" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --force

          echo ""
          echo "=========================================="
          echo "ANDROID DEPLOYMENT FINISHED"
          echo "=========================================="


      # ==========================================
      # 19. Search APK
      # ==========================================
      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          echo ""
          echo "APK files:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo ""
          echo "AAB files:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print 2>/dev/null || true


      # ==========================================
      # 20. Prepare final APK
      # ==========================================
      - name: Prepare final APK
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          APK_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            ! -path "*/artifacts/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching all APK files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"


      # ==========================================
      # 21. Upload APK
      # ==========================================
      - name: Upload Dairy Farm APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: artifacts/Dairy-Farm.apk
          if-no-files-found: error


      # ==========================================
      # 22. Final result
      # ==========================================
      - name: Final result
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "DAIRY FARM BUILD RESULT"
          echo "=========================================="

          if [ -f "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk" ]; then

            echo ""
            echo "SUCCESS!"
            echo ""
            echo "Dairy-Farm.apk was created."

            ls -lh \
              "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"

          else

            echo ""
            echo "FAILED"
            echo ""
            echo "Dairy-Farm.apk was NOT created."

          fi
