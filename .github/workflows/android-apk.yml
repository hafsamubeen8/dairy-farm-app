name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          ls -la
          test -f dairy_app.py
          test -f main.py
          test -f dairy_farm.db

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;28.0.13004108"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.2
          pip install pkginfo packaging jinja2 tqdm buildozer setuptools

      - name: Download Android PySide6 wheel
        run: |
          wget https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

      - name: Download Android Shiboken6 wheel
        run: |
          wget https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

      - name: Find Android wheels
        run: |
          ls -lh *.whl

      - name: Check deployment tool
        run: |
          pyside6-android-deploy --help

      - name: Build Android APK
        run: |
          PYSIDE_WHEEL=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "pyside6-*-android_aarch64.whl" | head -n 1)
          SHIBOKEN_WHEEL=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "shiboken6-*-android_aarch64.whl" | head -n 1)

          echo "PySide wheel: $PYSIDE_WHEEL"
          echo "Shiboken wheel: $SHIBOKEN_WHEEL"

          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"

          pyside6-android-deploy \
            --name "Dairy Farm" \
            --input main.py \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --ndk-path "$ANDROID_NDK_ROOT" \
            --sdk-path "$ANDROID_SDK_ROOT" \
            --force

      - name: Find APK
        run: |
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: |
            **/*.apk
            **/*.aab
