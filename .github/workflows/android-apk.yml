name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          ls -la
          test -f dairy_app.py
          test -f main.py
          test -f dairy_farm.db
          echo "All project files found."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Fix Android SDK tools
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_SDK_ROOT"

          MODERN_SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$MODERN_SDKMANAGER" ]; then
            echo "ERROR: Modern sdkmanager not found."
            exit 1
          fi

          echo "Modern sdkmanager:"
          echo "$MODERN_SDKMANAGER"

          MODERN_SDK_BIN=$(dirname "$MODERN_SDKMANAGER")

          echo "$MODERN_SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          cat > "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" <<EOF
          #!/bin/bash
          exec "$MODERN_SDKMANAGER" "\$@"
          EOF

          chmod +x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108"

          yes | "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --licenses || true

          echo "Android SDK setup complete."

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install PySide6==6.11.2

          pip install \
            pkginfo \
            packaging \
            jinja2 \
            tqdm \
            buildozer \
            setuptools

      - name: Download Android PySide6 wheel
        run: |
          wget -q \
            https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

      - name: Download Android Shiboken6 wheel
        run: |
          wget -q \
            https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

      - name: Check Android wheels
        run: |
          ls -lh *.whl

          test -f pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl
          test -f shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          echo "Android wheels found."

      - name: Check deployment tool
        run: |
          pyside6-android-deploy --help

      - name: Build Android APK
        shell: bash
        run: |

          PYSIDE_WHEEL="$GITHUB_WORKSPACE/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          SHIBOKEN_WHEEL="$GITHUB_WORKSPACE/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo "PySide6 wheel:"
          echo "$PYSIDE_WHEEL"

          echo "Shiboken6 wheel:"
          echo "$SHIBOKEN_WHEEL"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "Android NDK:"
          echo "$ANDROID_NDK_ROOT"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Starting Android build..."

          pyside6-android-deploy \
            --name "Dairy Farm" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --ndk-path "$ANDROID_NDK_ROOT" \
            --sdk-path "$ANDROID_SDK_ROOT" \
            --force

      - name: Find APK
        if: always()
        run: |
          echo "Searching for APK/AAB..."

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
