name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          ls -la
          test -f dairy_app.py
          test -f main.py
          test -f dairy_farm.db

      - name: Install PySide6 and deployment requirements
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.1
          pip install pkginfo packaging jinja2 tqdm buildozer setuptools

      - name: Install Android deployment requirements
        run: |
          pip install -r /opt/hostedtoolcache/Python/3.11.16/x64/lib/python3.11/site-packages/PySide6/scripts/requirements-android.txt

      - name: Check PySide6 deployment
        run: |
          pyside6-android-deploy --help

      - name: Build Android APK
        run: |
          pyside6-android-deploy \
            --name "Dairy Farm" \
            --input main.py

      - name: Find APK
        run: |
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: |
            **/*.apk
            **/*.aab
