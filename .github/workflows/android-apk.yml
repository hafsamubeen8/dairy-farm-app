```yaml
name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Get project
      - name: Get project
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Check project files
      - name: Check project files
        run: |
          echo "Checking Dairy Farm project..."

          ls -la

          test -f dairy_app.py
          test -f main.py
          test -f dairy_farm.db

          echo "All project files found."

      # 5. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 6. Install Android SDK + NDK 28
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          echo "Finding modern sdkmanager..."

          MODERN_SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$MODERN_SDKMANAGER" ]; then
            echo "ERROR: Modern sdkmanager not found."
            exit 1
          fi

          echo "Modern sdkmanager:"
          echo "$MODERN_SDKMANAGER"

          "$MODERN_SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108"

          yes | "$MODERN_SDKMANAGER" --licenses || true

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/28.0.13004108"

          if [ ! -d "$NDK_PATH" ]; then
            echo "ERROR: NDK 28 was not installed."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo "NDK_PATH=$NDK_PATH" >> "$GITHUB_ENV"

          echo "================================="
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"
          echo "================================="

          echo "Android NDK:"
          echo "$NDK_PATH"
          echo "================================="

          "$NDK_PATH/ndk-build" --version || true

      # 7. Fix old sdkmanager used by Buildozer
      - name: Fix old Android sdkmanager
        shell: bash
        run: |
          echo "Fixing old Android sdkmanager..."

          MODERN_SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1)

          if [ -z "$MODERN_SDKMANAGER" ]; then
            echo "ERROR: Modern sdkmanager not found."
            exit 1
          fi

          echo "Modern sdkmanager:"
          echo "$MODERN_SDKMANAGER"

          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"

          cat > "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" <<EOF
#!/bin/bash
exec "$MODERN_SDKMANAGER" "\$@"
EOF

          chmod +x "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"

          echo "Testing fixed sdkmanager..."

          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

          echo "sdkmanager fixed successfully."

      # 8. Make sure old sdkmanager is first in PATH
      - name: Update Android PATH
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android PATH updated."

      # 9. Install Python packages
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install PySide6==6.11.2

          pip install \
            pkginfo \
            packaging \
            jinja2 \
            tqdm \
            buildozer \
            setuptools

          echo "Python packages installed."

      # 10. Download Android PySide6 wheel
      - name: Download Android PySide6 wheel
        run: |
          wget -q \
            https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          echo "PySide6 Android wheel downloaded."

      # 11. Download Android Shiboken6 wheel
      - name: Download Android Shiboken6 wheel
        run: |
          wget -q \
            https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          echo "Shiboken6 Android wheel downloaded."

      # 12. Check wheels
      - name: Check Android wheels
        run: |
          echo "Checking Android wheels..."

          ls -lh *.whl

          test -f pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          test -f shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl

          echo "Android wheels found."

      # 13. Check PySide deployment tool
      - name: Check deployment tool
        run: |
          pyside6-android-deploy --help

      # 14. Clean previous Android build
      - name: Clean old Android build
        run: |
          echo "Cleaning old Android build..."

          rm -rf .buildozer
          rm -rf deployment

          echo "Old Android build removed."

      # 15. Verify Java / SDK / NDK
      - name: Verify Android environment
        shell: bash
        run: |
          echo "================================="
          echo "ANDROID ENVIRONMENT"
          echo "================================="

          echo "Java:"
          java -version

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Android NDK:"
          echo "$ANDROID_NDK_ROOT"

          echo ""
          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo ""
          echo "ANDROIDNDK:"
          echo "$ANDROIDNDK"

          echo ""
          echo "Testing NDK..."

          "$ANDROID_NDK_ROOT/ndk-build" --version || true

          echo ""
          echo "Testing sdkmanager..."

          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --version

          echo ""
          echo "Environment check complete."

      # 16. Build APK
      - name: Build Android APK
        shell: bash
        run: |

          PYSIDE_WHEEL="$GITHUB_WORKSPACE/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          SHIBOKEN_WHEEL="$GITHUB_WORKSPACE/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo "================================="
          echo "STARTING DAIRY FARM APK BUILD"
          echo "================================="

          echo ""
          echo "PySide6 wheel:"
          echo "$PYSIDE_WHEEL"

          echo ""
          echo "Shiboken6 wheel:"
          echo "$SHIBOKEN_WHEEL"

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Android NDK:"
          echo "$ANDROID_NDK_ROOT"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "================================="
          echo "RUNNING PYSIDE6-ANDROID-DEPLOY"
          echo "================================="

          pyside6-android-deploy \
            --name "Dairy Farm" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --ndk-path "$ANDROID_NDK_ROOT" \
            --sdk-path "$ANDROID_SDK_ROOT" \
            --force

      # 17. Find APK
      - name: Find APK
        if: always()
        run: |
          echo "================================="
          echo "SEARCHING FOR APK/AAB"
          echo "================================="

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      # 18. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error
```
