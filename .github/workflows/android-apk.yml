name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout project
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. Python 3.11
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 4. Check project
      # ============================================================
      - name: Check project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DAIRY FARM PROJECT"
          echo "======================================"

          pwd
          echo ""

          find . -maxdepth 2 -type f | sort

          echo ""

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py not found."
            echo ""
            echo "Your project must contain main.py"
            exit 1
          fi

          echo "main.py found."


      # ============================================================
      # 5. Install basic Linux dependencies
      # ============================================================
      - name: Install Linux dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            unzip \
            zip \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libdbus-1-dev

          echo "Linux dependencies installed."


      # ============================================================
      # 6. Install Python build dependencies
      # ============================================================
      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            PySide6==6.11.2 \
            shiboken6==6.11.2 \
            packaging \
            jinja2 \
            tqdm

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "PySide6:"
          python -c "import PySide6; print(PySide6.__version__)"


      # ============================================================
      # 7. Download Android PySide6 wheels
      # ============================================================
      - name: Download Android wheels
        shell: bash
        run: |
          set -e

          echo "Downloading PySide6 Android wheel..."

          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo ""
          echo "Downloading Shiboken6 Android wheel..."

          wget -q --show-progress \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo ""
          echo "Downloaded wheels:"
          ls -lh *.whl


      # ============================================================
      # 8. Verify Android wheels
      # ============================================================
      - name: Verify Android wheels
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL="$GITHUB_WORKSPACE/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_WHEEL="$GITHUB_WORKSPACE/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          test -f "$PYSIDE_WHEEL"
          test -f "$SHIBOKEN_WHEEL"

          echo "PySide6 Android wheel OK."
          echo "Shiboken6 Android wheel OK."


      # ============================================================
      # 9. Check deployment tool
      # ============================================================
      - name: Check PySide Android deploy
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PYSIDE6 ANDROID DEPLOY"
          echo "======================================"

          command -v pyside6-android-deploy

          pyside6-android-deploy --help


      # ============================================================
      # 10. Create output directory
      # ============================================================
      - name: Prepare output
        shell: bash
        run: |
          set -e

          rm -rf artifacts
          mkdir -p artifacts

          echo "Output directory ready."


      # ============================================================
      # 11. Build APK
      # ============================================================
      - name: Build Dairy Farm APK
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL="$GITHUB_WORKSPACE/pyside6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_WHEEL="$GITHUB_WORKSPACE/shiboken6-6.11.2-6.11.2-cp311-cp311-android_aarch64.whl"

          echo "======================================"
          echo "BUILDING DAIRY FARM APK"
          echo "======================================"

          echo ""
          echo "Main file:"
          ls -lh main.py

          echo ""
          echo "PySide6 wheel:"
          ls -lh "$PYSIDE_WHEEL"

          echo ""
          echo "Shiboken6 wheel:"
          ls -lh "$SHIBOKEN_WHEEL"

          echo ""
          echo "Running pyside6-android-deploy..."

          pyside6-android-deploy \
            --name "Dairy Farm" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --force

          echo ""
          echo "======================================"
          echo "PYSIDE6 DEPLOYMENT FINISHED"
          echo "======================================"


      # ============================================================
      # 12. Find APK
      # ============================================================
      - name: Find APK
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          echo ""
          echo "APK files:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo ""
          echo "AAB files:"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.aab" \
            -print 2>/dev/null || true


      # ============================================================
      # 13. Prepare APK
      # ============================================================
      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            ! -path "*/artifacts/*" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Full APK/AAB search:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            echo ""
            echo "Deployment folders:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type d \
              \( -name "*build*" -o -name "*deploy*" -o -name "*android*" \) \
              -print || true

            exit 1
          fi

          echo "======================================"
          echo "APK FOUND"
          echo "======================================"

          echo "$APK_FILE"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"

          echo ""
          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"


      # ============================================================
      # 14. Upload APK
      # ============================================================
      - name: Upload Dairy Farm APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: artifacts/Dairy-Farm.apk
          if-no-files-found: error


      # ============================================================
      # 15. Summary
      # ============================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "DAIRY FARM APK BUILD SUMMARY"
          echo "======================================"

          if [ -f "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk" ]; then

            echo ""
            echo "BUILD STATUS: SUCCESS"
            echo ""
            echo "APK:"
            ls -lh "$GITHUB_WORKSPACE/artifacts/Dairy-Farm.apk"

          else

            echo ""
            echo "BUILD STATUS: FAILED"
            echo ""
            echo "APK was not created."

          fi
