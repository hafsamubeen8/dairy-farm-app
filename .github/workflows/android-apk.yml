name: Build Dairy Farm APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check project files
        run: |
          ls -la
          test -f dairy_app.py
          test -f main.py
          test -f dairy_farm.db

      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.1
          pip install pkginfo packaging buildozer setuptools

      - name: Build Android APK
        run: |
          pyside6-android-deploy \
            --name "Dairy Farm" \
            --input main.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: |
            *.apk
            *.aab
            build/*.apk
            build/*.aab
